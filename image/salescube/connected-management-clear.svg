<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">세일즈큐브 통합 운영 구조</title>
  <desc id="desc">점주 웹과 중앙 서버가 매장·고객·매출 정보를 관리하고, 중앙 서버와 자판기가 프로그램과 상품 정보를 연동합니다. 고객은 자판기로 회원 인증과 상품 구매를 진행하며 영수증을 발행할 수 있습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 7 4 0 8Z" fill="#9aa4ae"/></marker>
    <g id="person" fill="none" stroke="#43698a" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <circle cy="-25" r="8"/><path d="M-8-14h16q11 0 11 12v20q0 5-5 5V0M-14 0v23q-5 0-5-5V-2q0-12 11-12M-8-9v52h7V12h2v31h7V-9"/>
    </g>
    <style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif}.label{fill:#bd8b27;font-size:22px;font-weight:700}.detail{fill:#515c66;font-size:18px}.ring{fill:#fff;stroke:#b8c0c6;stroke-width:2.6}.link{fill:none;stroke:#9aa4ae;stroke-width:2;stroke-dasharray:6 6}</style>
  </defs>
  <rect width="1000" height="720" fill="#fff"/>
  <!-- Point-of-sale relationships retain the original diagram layout. -->
