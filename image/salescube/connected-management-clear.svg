  <g stroke="#43698a" stroke-width="2.8" stroke-linejoin="round"><rect x="197" y="367" width="29" height="42" rx="2" fill="#a3c5df"/><path d="M201 374h21m-21 6h21"/><path d="M214 382h34v46l-4-3-4 3-5-3-4 3-4-3-4 3-4-3-5 3Z" fill="#fff"/><path d="M220 391h22m-22 8h22m-22 8h22"/></g>
