  <path class="link" d="M573 165V300" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M588 300V165"/>
  <path class="link" d="M541 390H285" marker-end="url(#arrow)"/>
  <path class="link" d="M573 488V558" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M588 558V488"/>
  <circle class="ring" cx="220" cy="105" r="55"/><use href="#person" x="220" y="98"/>
  <text class="label" x="220" y="192" text-anchor="middle">점주</text><text class="label" x="220" y="221" text-anchor="middle">(WEB)</text>
  <g class="detail"><text x="327" y="133">· 실시간 매장관리</text><text x="327" y="161">· 고객(사용자) 관리</text><text x="327" y="189">· 매출 관리</text><text x="327" y="217">· 관리자 관리</text><text x="327" y="245">· 마일리지 관리</text><text x="327" y="273">· 프로모션 관리</text></g>
  <circle class="ring" cx="580" cy="105" r="55"/>
